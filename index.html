<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Like Me?</title>
  <link rel="shortcut icon" href="Symbol.png">
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Press Start 2P', cursive;
      background: #FFE6E6; /* Light pink background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 50px; /* Fixed size */
      height: 50px; /* Fixed size */
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #D32F2F; /* Dark red text */
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.8); /* Love-themed shadow (soft pink glow) */
      margin-bottom: 20px;
      transition: text-shadow 0.3s ease;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.2rem;
      padding: 15px 30px;
      border: 3px solid #D32F2F; /* Dark red border */
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #FF5252; /* Bright red button */
      color: #FFF; /* White text */
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.8); /* Love-themed shadow */
      text-shadow: none; /* No shadow on button text */
    }

    button:hover {
      background-color: #FF867F; /* Lighter red hover effect */
      transform: scale(1.1); /* Scale up on hover */
      box-shadow: 0 0 20px rgba(255, 105, 180, 1); /* Enhanced shadow on hover */
    }

    #yesButton {
      background-color: #FFCDD2; /* Light pink button */
      color: #D32F2F;
    }

    #noButton {
      background-color: #D32F2F; /* Dark red button */
      color: #FFF;
    }

    .gif-container {
      display: none;
      margin-top: 20px;
    }

    .gif-container img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
    }

    .user-message {
      display: none;
      font-size: 1.5rem;
      color: #D32F2F;
      margin-top: 20px;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: #D32F2F;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* Pop-up Box */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup-box {
      background: #FFE6E6;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
      text-align: center;
      position: relative;
      width: 300px;
    }

    .popup-box h2 {
      font-size: 1.5rem;
      color: #D32F2F;
      margin-bottom: 20px;
    }

    .popup-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 2px solid #D32F2F;
      border-radius: 5px;
      font-family: 'Press Start 2P', cursive;
      font-size: 1rem;
      color: #D32F2F;
    }

    .popup-box button {
      background-color: #FF5252;
      color: #FFF;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      font-size: 1rem;
    }

    .popup-box button:hover {
      background-color: #FF867F;
    }

    .close-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 30px;
      height: 30px;
      background: #D32F2F;
      color: #FFF;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .close-btn:hover {
      background: #FF5252;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <img src="Symbol.png" alt="Company Logo" class="logo">
  <div class="container">
    <h1>Do you like me?</h1>
    <div class="buttons">
      <button id="yesButton">Yes</button>
      <button id="noButton">No</button>
    </div>
    <div class="gif-container">
      <img src="https://media.giphy.com/media/3o7abAHdYvZdBNnGZq/giphy.gif" alt="Acceptance GIF">
    </div>
    <div class="user-message" id="userMessage"></div>
  </div>

  <footer>
    Developed with ❤️ by rektor.Adityabonde | 2025
  </footer>

  <!-- Pop-up Box -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="close-btn" id="closeBtn">✕</div>
      <h2>What's your name?</h2>
      <input type="text" id="userNameInput" placeholder="Enter your name">
      <button id="submitName">Submit</button>
    </div>
  </div>

  <script>
    // Pop-up Logic
    const popupOverlay = document.getElementById('popupOverlay');
    const closeBtn = document.getElementById('closeBtn');
    const submitNameBtn = document.getElementById('submitName');
    const userNameInput = document.getElementById('userNameInput');
    let userName = "Friend"; // Default name

    // Show pop-up on page load
    popupOverlay.style.display = 'flex';

    // Close pop-up when close button is clicked
    closeBtn.addEventListener('click', () => {
      popupOverlay.style.display = 'none';
    });

    // Submit name and close pop-up
    submitNameBtn.addEventListener('click', () => {
      userName = userNameInput.value.trim() || "Friend"; // Use input or default
      popupOverlay.style.display = 'none';
    });

    // Main Logic
    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const gifContainer = document.querySelector('.gif-container');
    const heading = document.querySelector('h1');
    const userMessage = document.getElementById('userMessage');
    let clickCount = 0;

    noButton.addEventListener('click', () => {
      clickCount++;
      const yesButtonSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
      yesButton.style.fontSize = `${yesButtonSize * 1.2}px`;
      yesButton.style.padding = `${parseFloat(window.getComputedStyle(yesButton).paddingTop) * 1.2}px ${parseFloat(window.getComputedStyle(yesButton).paddingRight) * 1.2}px`;

      if (clickCount >= 4) {
        yesButton.style.width = '100vw';
        yesButton.style.height = '100vh';
        yesButton.style.position = 'fixed';
        yesButton.style.top = '0';
        yesButton.style.left = '0';
        yesButton.style.borderRadius = '0';
        yesButton.style.fontSize = '3rem';
        noButton.style.display = 'none';
      }
    });

    yesButton.addEventListener('click', () => {
      document.querySelector('.buttons').style.display = 'none';
      heading.textContent = "I knew it! You're stuck with me now! 😜";
      heading.style.marginTop = '0'; /* Ensure text stays centered */
      gifContainer.style.display = 'block';

      // Display the user's name with a relevant message
      userMessage.textContent = `${userName}, you just made my day! 💖`;
      userMessage.style.display = 'block';
    });
  </script>
</body>
</html>
